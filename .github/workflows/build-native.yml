name: Build native libraries and .NET package

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Run managed and fixture tests
        shell: pwsh
        run: ./tests/run-tests.ps1
      - name: Build Linux native libraries
        shell: pwsh
        run: ./build-native.ps1 -RuntimeIdentifier linux-x64
      - name: Smoke test native libraries on Debian 12
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env XDG_RUNTIME_DIR=/tmp \
            --env LD_LIBRARY_PATH=/src/artifacts/linux-x64 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src" \
            --workdir /src \
            mcr.microsoft.com/dotnet/sdk@sha256:1b955f179b02df4f0eb5fadedaa898cbe44d620a64aab52eec72c8e91d1355b5 \
            dotnet run --project tests/StorageC.NativeSmokeTests -c Release
      - uses: actions/upload-artifact@v7
        with:
          name: storagec-linux-x64
          path: artifacts/linux-x64/
          if-no-files-found: error

  win-x64:
    if: github.event_name != 'schedule'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Install MSYS2 UCRT64 GCC
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Configure GCC for fixture tests
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $gccDirectory = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          $compiler = Join-Path $gccDirectory 'gcc.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "MSYS2 setup completed but GCC is missing: $compiler"
          }
          $gccDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $compiler --version
          if ($LASTEXITCODE -ne 0) { throw 'GCC could not be executed.' }
      - name: Run managed and fixture tests
        shell: pwsh
        run: ./tests/run-tests.ps1
      - name: Build Windows native libraries
        shell: pwsh
        run: ./build-native.ps1 -RuntimeIdentifier win-x64
      - uses: actions/upload-artifact@v7
        with:
          name: storagec-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error

  smb-performance:
    needs: linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      samba:
        image: dockurr/samba@sha256:2a0452a12b7a244a22f18d0f233101bb8d4952b5500ae263905e3b9dad3bf2ae
        env:
          NAME: bench
          USER: bench
          PASS: benchpass
        ports:
          - 445/tcp
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: storagec-linux-x64
          path: artifacts/linux-x64
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Wait for Samba
        shell: bash
        env:
          SMB_PORT: ${{ job.services.samba.ports['445'] }}
        run: |
          for attempt in {1..30}; do
            if timeout 1 bash -c "</dev/tcp/127.0.0.1/$SMB_PORT" 2>/dev/null; then
              exit 0
            fi
            echo "Waiting for Samba ($attempt/30)..."
            sleep 1
          done
          echo "Samba did not become ready on port $SMB_PORT." >&2
      - name: Download previous main performance baseline
        id: baseline
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=StorageC-smb-performance-main&per_page=10" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty' \
            2>/dev/null || true)"
          if [[ -z "$artifact_id" ]]; then
            echo "No previous main performance artifact is available."
            exit 0
          fi
          mkdir -p artifacts/performance-baseline
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/storagec-performance.zip
          unzip -q /tmp/storagec-performance.zip -d artifacts/performance-baseline
          baseline="$(find artifacts/performance-baseline -name result.json -type f -print -quit)"
          if [[ -n "$baseline" ]]; then
            echo "path=$baseline" >> "$GITHUB_OUTPUT"
            echo "Using baseline $baseline from artifact $artifact_id."
          fi
      - name: Determine previous release
        if: startsWith(github.ref, 'refs/tags/v')
        id: previous-release
        shell: bash
        run: |
          previous_tag="$(git tag --list 'v*' --sort=-v:refname | grep -Fvx "$GITHUB_REF_NAME" | head -n 1)"
          if [[ -z "$previous_tag" ]]; then
            echo "No previous release tag is available."
            exit 0
          fi
          echo "version=${previous_tag#v}" >> "$GITHUB_OUTPUT"
          echo "Previous release: $previous_tag"
      - name: Benchmark previous release on the current runner
        if: startsWith(github.ref, 'refs/tags/v') && steps.previous-release.outputs.version != ''
        id: release-baseline
        env:
          SMB_HOST: 127.0.0.1
          SMB_PORT: ${{ job.services.samba.ports['445'] }}
          SMB_SHARE: bench
          SMB_USER: bench
          SMB_PASSWORD: benchpass
          STORAGEC_PERF_DURATION_SECONDS: "180"
          STORAGEC_PERF_ENFORCE: "false"
          STORAGEC_PERF_OUTPUT: artifacts/performance-release-baseline
        shell: bash
        run: |
          dotnet run --project tests/StorageC.LoadTests.Baseline -c Release \
            -p:StorageCBaselineVersion=${{ steps.previous-release.outputs.version }}
          echo "path=artifacts/performance-release-baseline/result.json" >> "$GITHUB_OUTPUT"
      - name: Run SMB performance test
        env:
          SMB_HOST: 127.0.0.1
          SMB_PORT: ${{ job.services.samba.ports['445'] }}
          SMB_SHARE: bench
          SMB_USER: bench
          SMB_PASSWORD: benchpass
          STORAGEC_PERF_DURATION_SECONDS: ${{ github.event_name == 'schedule' && '900' || startsWith(github.ref, 'refs/tags/v') && '180' || '45' }}
          STORAGEC_PERF_BASELINE: ${{ steps.release-baseline.outputs.path || steps.baseline.outputs.path }}
          STORAGEC_PERF_ENFORCE: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          STORAGEC_PERF_OUTPUT: artifacts/performance
        run: dotnet run --project tests/StorageC.LoadTests -c Release
      - name: Add performance report to job summary
        if: always() && hashFiles('artifacts/performance/report.md') != ''
        shell: bash
        run: cat artifacts/performance/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload performance report
        if: always() && hashFiles('artifacts/performance/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref == 'refs/heads/main' && 'StorageC-smb-performance-main' || format('StorageC-smb-performance-{0}', github.run_id) }}
          path: artifacts/performance/
          if-no-files-found: error
          retention-days: 90

  dotnet-package:
    needs: [linux-x64, win-x64, smb-performance]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: storagec-linux-x64
          path: artifacts/linux-x64
      - uses: actions/download-artifact@v7
        with:
          name: storagec-win-x64
          path: artifacts/win-x64
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Validate tag and determine package version
        if: startsWith(github.ref, 'refs/tags/')
        id: package-version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Tag must use a NuGet-compatible version such as v1.2.3 or v1.2.3-beta.1." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build wrapper
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: dotnet build StorageC.sln -c Release -p:ContinuousIntegrationBuild=true
      - name: Build tagged wrapper
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          dotnet build StorageC.sln -c Release
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ steps.package-version.outputs.version }}
          -p:PackageVersion=${{ steps.package-version.outputs.version }}
      - name: Pack wrapper and native runtimes
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: dotnet pack src/StorageC/StorageC.csproj -c Release --no-build -o artifacts/packages
      - name: Pack tagged release
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          dotnet pack src/StorageC/StorageC.csproj
          -c Release --no-build -o artifacts/packages
          -p:Version=${{ steps.package-version.outputs.version }}
          -p:PackageVersion=${{ steps.package-version.outputs.version }}
      - name: Smoke test NuGet package on Debian 12
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version || '0.1.0' }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env XDG_RUNTIME_DIR=/tmp \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src" \
            --workdir /src \
            mcr.microsoft.com/dotnet/sdk@sha256:1b955f179b02df4f0eb5fadedaa898cbe44d620a64aab52eec72c8e91d1355b5 \
            dotnet run --project tests/StorageC.NativeSmokeTests -c Release \
              -p:StorageCPackageVersion="$PACKAGE_VERSION" \
              -p:RestoreSources=/src/artifacts/packages
      - uses: actions/upload-artifact@v7
        with:
          name: StorageC-dotnet-package
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  nuget-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dotnet-package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: StorageC-dotnet-package
          path: artifacts/packages
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Authenticate to NuGet.org with trusted publishing
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: hakancuraci
      - name: Publish package to NuGet.org
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
